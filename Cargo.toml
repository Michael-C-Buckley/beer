[workspace]
resolver = "3"
members = ["crates/beer", "crates/beer-protocols"]

[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.95.0"
license = "EUPL-1.2"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1

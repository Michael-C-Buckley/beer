[workspace]
resolver = "3"
members  = [ "crates/beer", "crates/beer-ipc", "crates/beer-protocols" ]

[workspace.package]
version      = "0.8.1"
edition      = "2024"
rust-version = "1.95.0"
license      = "EUPL-1.2"

[workspace.dependencies]
# Workspace components
beer-protocols = { path = "crates/beer-protocols", version = "0.8.1" }
beer-ipc = { path = "crates/beer-ipc", version = "0.8.1" }

# Other dependencies
anyhow = "1.0.104"
calloop = { version = "0.14.4", features = [ "signals" ] }
calloop-wayland-source = "0.4.1"
flate2 = "1.1.9"
fontconfig = "0.11.0"
freetype-rs = "0.38.0"
harfbuzz_rs_now = "2.3.2"
image = { version = "0.25.10", default-features = false, features = [
  "png",
  "jpeg",
  "gif",
  "bmp",
  "webp",
] }
libc = "0.2.189"
lru = "0.18.1"
pound = "0.1.6"
rustix = { version = "1.1.4", features = [
  "pty",
  "process",
  "termios",
  "stdio",
  "fs",
  "shm",
  "mm",
] }
serde = { version = "1.0.229", features = [ "derive" ] }
serde_ignored = "0.1.14"
thiserror = "2.0.19"
toml = "1.1.3"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = [ "env-filter" ] }
unicode-width = "0.2.2"
vte = "0.15.0"

smithay-client-toolkit = "0.21.1"
wayland-client         = "0.31.15"
wayland-protocols      = { version = "0.32.13", features = [ "client", "staging", "unstable" ] }

# See:
#  <https://doc.rust-lang.org/rustc/lints/listing/allowed-by-default.html>
[workspace.lints.clippy]
cargo      = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
nursery    = { level = "warn", priority = -1 }
pedantic   = { level = "warn", priority = -1 }
perf       = { level = "warn", priority = -1 }
style      = { level = "warn", priority = -1 }

# The lint groups above enable some less-than-desirable rules, we should manually
# enable those to keep our sanity.
absolute_paths                       = "warn"
allow_attributes                     = "deny"
allow_attributes_without_reason      = "deny"
arbitrary_source_item_ordering       = "allow"
clone_on_ref_ptr                     = "warn"
dbg_macro                            = "warn"
empty_drop                           = "warn"
empty_structs_with_brackets          = "warn"
excessive_nesting                    = "warn"
exit                                 = "warn"
filetype_is_file                     = "warn"
get_unwrap                           = "warn"
implicit_return                      = "allow"
infinite_loop                        = "warn"
iter_on_single_items                 = "warn"
map_with_unused_argument_over_ranges = "warn"
missing_docs_in_private_items        = "allow"
non_ascii_literal                    = "allow"
non_std_lazy_statics                 = "warn"
non_zero_suggestions                 = "warn"
pathbuf_init_then_push               = "warn"
pattern_type_mismatch                = "allow"
precedence_bits                      = "warn"
pub_underscore_fields                = "warn"
question_mark_used                   = "allow"
rc_buffer                            = "warn"
rc_mutex                             = "warn"
redundant_clone                      = "warn"
rest_pat_in_fully_bound_structs      = "warn"
self_named_module_files              = "warn"
significant_drop_in_scrutinee        = "warn"
similar_names                        = "allow"
single_call_fn                       = "allow"
std_instead_of_core                  = "allow"
suspicious_operation_groupings       = "warn"
too_long_first_doc_paragraph         = "allow"
too_many_lines                       = "allow"
undocumented_unsafe_blocks           = "warn"
unnecessary_safety_comment           = "warn"
unused_peekable                      = "warn"
unused_result_ok                     = "warn"
unused_trait_names                   = "allow"

# False positive:
# clippy's build script check doesn't recognize workspace-inherited metadata
# which means in our current workspace layout, we get pranked by Clippy.
cargo_common_metadata   = "allow"
multiple_crate_versions = "allow" # :(

# In the honor of a recent Cloudflare regression
panic       = "deny"
unwrap_used = "deny"

# Less dangerous, but we'd like to know
# Those must be opt-in, and are fine ONLY in tests and examples. We *can* panic
# in NDG (the binary crate), but it should be very deliberate
expect_used   = "warn"
print_stderr  = "warn"
print_stdout  = "warn"
todo          = "warn"
unimplemented = "warn"
unreachable   = "warn"

[workspace.lints.rust]
missing_debug_implementations = "warn"
non_ascii_idents              = "warn" # prevent non-ASCII identifiers
tail_expr_drop_order          = "warn" # catch temporaries dropped in surprising order
unit_bindings                 = "warn" # catch useless `let _ = expr` bindings
unsafe_code                   = "warn" # guess
unsafe_op_in_unsafe_fn        = "warn" # require unsafe blocks even inside unsafe fn
unused_unsafe                 = "warn" # catch unnecessary unsafe blocks

[profile.release]
codegen-units = 1
lto           = "thin"
opt-level     = 3
strip         = true

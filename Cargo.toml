[package]
name = "beer"
version = "0.1.0"
edition = "2024"
rust-version = "1.95.0"
description = "A fast, software-rendered, Wayland-native terminal emulator"
license = "EUPL-1.2"
readme = true

[dependencies]
anyhow = "1.0.102"
calloop = "0.14.4"
calloop-wayland-source = "0.4.1"
fontconfig = "0.11.0"
freetype-rs = "0.38.0"
lru = "0.18.0"
pound = "0.1.6"
rustix = { version = "1.1.4", features = [
  "pty",
  "process",
  "termios",
  "stdio",
  "fs",
] }
smithay-client-toolkit = "0.20.0"
thiserror = "2.0.18"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
unicode-width = "0.2.2"
vte = "0.15.0"
wayland-client = "0.31.14"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1

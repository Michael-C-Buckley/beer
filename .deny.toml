[advisories]
version = 2
yanked  = "deny"

[licenses]
allow = [
  "EUPL-1.2",
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
  "MPL-2.0",
]
version = 2

[bans]
multiple-versions = "warn"
wildcards         = "allow"

[sources]
unknown-git      = "deny"
unknown-registry = "deny"

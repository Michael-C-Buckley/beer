[package]
name                   = "beer-protocols"
description            = "Terminal protocol codecs and key/mouse wire encoders used by beer"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
readme                 = true

[dependencies]
# Provides the keyboard vocabulary (Keysym, Modifiers, KeyEvent) the key
# encoder consumes.
smithay-client-toolkit.workspace = true

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false, features = [
  "cargo_bench_support",
] }

[[bench]]
name    = "protocols"
harness = false

[lints]
workspace = true
